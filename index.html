<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Миссия: Дружный класс — Genialpardy</title><style>
@import url('');
:root{font-family:'Trebuchet MS',Verdana,Arial,sans-serif;color:#28345a;background:#edf8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 9% 16%,#fff5ac 0 58px,transparent 60px),radial-gradient(circle at 93% 9%,#ffcbdc 0 75px,transparent 77px),radial-gradient(circle at 80% 91%,#c7f4d8 0 120px,transparent 122px),linear-gradient(160deg,#e6f7ff,#fff1d8 55%,#f4eaff);background-attachment:fixed}main{max-width:1390px;margin:auto;padding:24px 30px 30px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}.eyebrow{display:inline-block;padding:9px 18px;background:#fff;border:2px solid #d3c5ff;border-radius:100px;color:#6952a2;font-size:14px;font-weight:800;box-shadow:0 4px 0 #e6dcff}h1{font-size:clamp(32px,4.5vw,60px);margin:12px 0 7px;letter-spacing:-.04em;color:#5d45ad;text-shadow:2px 3px #fff}h1 .sun{display:inline-block;transform:rotate(-12deg)}p{color:#556389;font-weight:600;font-size:clamp(15px,1.5vw,20px);margin:4px 0}.progress-wrap{border-radius:24px;background:white;box-shadow:0 7px 0 #d6e4fb;padding:15px 20px;min-width:215px;border:3px solid #dce9ff;text-align:center}.progress-wrap strong{font-size:17px;color:#6653ac}.meter{height:14px;border-radius:40px;background:#e9e9ff;margin-top:9px;overflow:hidden}.meter-fill{width:0;height:100%;background:linear-gradient(90deg,#ffba56,#ff70a4);border-radius:40px;transition:width .4s}.board-wrap{margin-top:22px;padding:15px;background:#fff;border:4px solid #fff;border-radius:28px;box-shadow:0 10px 0 #d5e4ee,0 20px 35px #7181a422}.board{display:grid;grid-template-columns:95px repeat(5,minmax(0,1fr));gap:10px}.cell{min-height:83px;border-radius:16px;display:grid;place-items:center;padding:8px;text-align:center}.heading{background:#e8e0ff;color:#573fa1;font-weight:900;font-size:clamp(13px,1.45vw,20px);border:3px solid #cfc1ff;line-height:1.15;box-shadow:0 4px 0 #c7b9ef}.heading:nth-child(3){background:#ffe1e9;color:#ba4776;border-color:#ffc0d5;box-shadow:0 4px 0 #f8b4c9}.heading:nth-child(4){background:#fff0bf;color:#a66d13;border-color:#ffe09d;box-shadow:0 4px 0 #f5d28f}.heading:nth-child(5){background:#d4f6e4;color:#29815e;border-color:#acebcc;box-shadow:0 4px 0 #a4dfc2}.heading:nth-child(6){background:#d8f0ff;color:#3779a9;border-color:#b1ddfc;box-shadow:0 4px 0 #a9d4ee}.price{background:#f4f0ff;font-weight:900;color:#745ab8;font-size:25px;border:2px dashed #cdbbf1}.tile{cursor:pointer;background:linear-gradient(155deg,#ffdf88,#ffb85a);color:#70462b;font-size:clamp(21px,3vw,35px);font-weight:900;border:3px solid #fff5d9;box-shadow:0 6px 0 #e99c48;transition:transform .12s,filter .12s;position:relative}.tile:hover,.tile:focus-visible{transform:translateY(-3px) rotate(-1deg);filter:saturate(1.17);box-shadow:0 9px 0 #e99c48}.tile.used{background:#daefde;color:#399469;border-color:#c8ecd1;box-shadow:none;cursor:default;font-size:30px}.footer{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:24px}.footer span{font-weight:800;color:#6a6690}.btn{background:linear-gradient(#ffc66b,#ffad4e);border:3px solid #fff3d3;border-radius:18px;color:#583c4e;padding:14px 22px;cursor:pointer;font-weight:900;font-size:17px;box-shadow:0 5px 0 #e59340;font-family:inherit}.btn:hover{transform:translateY(-2px)}.btn.secondary{color:#5b4ba5;background:#e3d7ff;border-color:#f5efff;box-shadow:0 5px 0 #c7b6ed}.btn:focus-visible,.tile:focus-visible{outline:4px solid #6b5bd1;outline-offset:3px}.overlay{position:fixed;inset:0;background:#39316bbd;backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;z-index:2;padding:18px}.overlay.open{display:flex}.panel{width:min(850px,100%);background:linear-gradient(160deg,#fff9e9,#fff 50%,#f1eaff);border:7px solid white;box-shadow:0 14px 0 #baa6e7,0 24px 70px #25205866;padding:clamp(24px,5vw,58px);border-radius:36px;text-align:center;position:relative}.panel:before{content:'✦';position:absolute;left:24px;top:12px;color:#f5b847;font-size:32px}.panel:after{content:'✿';position:absolute;right:30px;top:12px;color:#f48aab;font-size:30px}.small{color:#8565c2;font-weight:900;letter-spacing:.03em;font-size:17px}.question{font-size:clamp(27px,3.8vw,43px);line-height:1.32;min-height:115px;margin:30px 0;color:#34466e;font-weight:900}.answer{background:#dcf8e7;border:3px solid #9ee5bb;padding:24px;border-radius:23px;font-size:clamp(20px,2.6vw,29px);font-weight:800;color:#267e57;margin-bottom:25px}.answer:before{content:'✓  Правильный ответ';display:block;font-size:17px;margin-bottom:12px;color:#4b966d}.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}.hint{font-size:15px;color:#7a7b97;margin-top:23px;font-weight:700}.sticker{font-size:clamp(28px,4vw,48px)}.decor{position:absolute;pointer-events:none;opacity:.65;font-size:28px}.decor.one{top:12px;right:11%;transform:rotate(15deg)}.decor.two{top:150px;right:4%;transform:rotate(-12deg)}@media(max-width:740px){main{padding:14px}.board-wrap{padding:5px;border-radius:16px}.board{grid-template-columns:45px repeat(5,minmax(0,1fr));gap:4px}.cell{min-height:56px;border-radius:9px;padding:2px}.heading{font-size:9px;overflow-wrap:anywhere;border-width:2px;box-shadow:none}.price{font-size:13px;border-width:1px}.tile{font-size:16px;border-width:1px;box-shadow:0 3px 0 #e99c48}.top .progress-wrap{width:100%;min-width:0}.footer{font-size:13px}.panel{padding:25px 15px;border-radius:22px}.question{min-height:0}.actions .btn{font-size:15px}}
</style></head><body><main><div class="top"><div><div class="eyebrow">🌈 Развитие личности · 2 «Б» класс · Итоговый урок</div><h1><span class="sun">⭐</span> Миссия: Дружный класс!</h1><p>Выбирай волшебную клетку, отвечай на вопрос и получай звёзды!</p></div><div class="progress-wrap"><strong id="progress">Пройдено: 0 / 25</strong><div class="meter"><div id="meterFill" class="meter-fill"></div></div></div></div><div class="board-wrap"><div class="board" id="board"></div></div><div class="footer"><span>🌟 100 баллов — легко · 🏆 500 баллов — сложнее</span><button class="btn secondary" id="reset">Начать игру заново</button></div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="question"><div class="panel"><div class="sticker">🦊 🌟 🐻</div><div class="small" id="meta"></div><div class="question" id="question"></div><div id="answer" class="answer" hidden></div><div class="actions"><button class="btn" id="show">Показать ответ</button><button class="btn secondary" id="complete">Вернуться на поле</button></div><div class="hint">Сначала обсудите ответ всем классом, затем проверьте себя.</div></div></div><script>
const categories=[
{name:'Мы разные',items:[['Чем могут отличаться одноклассники? Назови два примера.','Внешностью, интересами, способностями, привычками.'],['Правда или ложь: все люди должны любить одни и те же занятия.','Ложь. У каждого человека свои интересы.'],['Назови одно своё качество, которое делает тебя особенным.','Любой подходящий пример: доброта, любознательность, аккуратность и другие.'],['Маша любит танцевать, а Дима — футбол. Могут ли они дружить? Почему?','Да. Разные интересы не мешают дружбе.'],['Почему нужно уважать людей, которые отличаются от нас?','Каждый человек ценен и заслуживает уважения.']]},
{name:'Мои права',items:[['Назови одно право ребёнка.','Право на образование, отдых, защиту, заботу и другие.'],['Имеют ли все дети одинаковые права?','Да, все дети имеют равные права.'],['Какое право нарушается, если ребёнку не разрешают посещать школу?','Право на образование.'],['Правда или ложь: право на отдых означает, что можно никогда не выполнять задания.','Ложь. У детей есть права и обязанности.'],['Одноклассник высказал мнение, с которым ты не согласен. Как поступишь?','Выслушаю его и вежливо выскажу своё мнение.']]},
{name:'Мои обязанности',items:[['Назови одну обязанность ученика.','Выполнять задания, соблюдать правила класса, уважать других.'],['Что нужно сделать после игры с общими игрушками?','Убрать игрушки на место.'],['Можно ли перебивать учителя, когда он объясняет задание?','Нет, нужно дождаться своей очереди.'],['У тебя есть право учиться. Какая обязанность с ним связана?','Стараться учиться и выполнять учебные задания.'],['Ты заметил, что друг оставил мусор под партой. Что сделаешь?','Вежливо напомню убрать мусор.']]},
{name:'Мир эмоций',items:[['Какую эмоцию испытывает ребёнок, когда получает желанный подарок?','Радость.'],['Как может чувствовать себя ребёнок, потерявший любимую игрушку?','Грусть, огорчение.'],['Назови два способа показать радость без слов.','Улыбка, радостные жесты или движения.'],['Друг проиграл в соревновании и расстроился. Что можно ему сказать?','«Ты старался!», «В следующий раз получится!»'],['Что можно сделать, если сильно разозлился?','Остановиться, спокойно подышать, рассказать о чувствах взрослому.']]},
{name:'Дружный класс',items:[['Что значит внимательно слушать собеседника?','Не перебивать и стараться понять его слова.'],['Что нужно сделать, если не понял рассказ друга?','Задать уточняющий вопрос.'],['Другу грустно. Как ты можешь его поддержать?','Выслушать, сказать добрые слова, предложить помощь.'],['Одноклассника постоянно обижают. К кому обратиться за помощью?','К учителю, родителям или другому взрослому, которому доверяешь.'],['Два друга поссорились из-за игры. Предложи мирный способ решить спор.','Спокойно выслушать друг друга и договориться о правилах или очередности.']]}];
let used=new Set();let selected=null;const $=id=>document.getElementById(id);
function render(){const board=$('board');board.replaceChildren();let header=document.createElement('div');header.className='cell price';header.textContent='🏆';board.append(header);categories.forEach(c=>{let d=document.createElement('div');d.className='cell heading';d.textContent=c.name;board.append(d)});for(let row=0;row<5;row++){let p=document.createElement('div');p.className='cell price';p.textContent=(row+1)*100;board.append(p);categories.forEach((cat,col)=>{const id=`${col}-${row}`,b=document.createElement('button');b.className='cell tile'+(used.has(id)?' used':'');b.textContent=used.has(id)?'✓':String((row+1)*100);b.disabled=used.has(id);b.addEventListener('click',()=>openQuestion(col,row));board.append(b)})}$('progress').textContent=`⭐ Собрано звёзд: ${used.size} / 25`; $('meterFill').style.width=`${used.size*4}%`}
function openQuestion(col,row){selected={col,row};$('meta').textContent=`${categories[col].name} · ${(row+1)*100} баллов`;$('question').textContent=categories[col].items[row][0];$('answer').textContent=categories[col].items[row][1];$('answer').hidden=true;$('show').hidden=false;$('overlay').classList.add('open');$('show').focus()}
$('show').onclick=()=>{$('answer').hidden=false;$('show').hidden=true};$('complete').onclick=()=>{if(selected)used.add(`${selected.col}-${selected.row}`);$('overlay').classList.remove('open');render();if(used.size===25){setTimeout(()=>alert('🏆 Ура! Все задания пройдены! Вы — дружный класс!'),120)}};$('reset').onclick=()=>{if(confirm('Начать заново? Все пройденные вопросы снова станут доступными.')){used.clear();render()}};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').classList.contains('open'))$('complete').click()});render();
</script></body></html>
